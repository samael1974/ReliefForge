name: Build installers

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  # I controlli girano su OGNI push e PR, non solo sui tag: e' il motivo per cui
  # esistono. La regressione della battuta vetro (V8.5.1) sarebbe passata inosservata
  # perche' la CI costruiva soltanto gli installer.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attiva pnpm
        run: corepack enable
      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - name: Build frontend
        run: pnpm exec vite build
      - name: Assieme cornice + passepartout (watertight, quote, battuta, vetro, angoli)
        run: pnpm assembly:check
      - name: Mesh adattiva (watertight, errore reale, ingombro)
        run: pnpm adaptive:check
      - name: Curva tonale (identita', monotonia, intervallo)
        run: pnpm curve:check
      - name: Invarianza STL (gli STL del rilievo non devono cambiare da soli)
        run: pnpm stl:check
      - name: Sola cornice (progetto senza bassorilievo)
        run: pnpm frameonly:check

  windows:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attiva pnpm
        run: corepack enable
      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm exec cross-env VITE_ELECTRON=1 vite build --base=./
      - name: Crea installer Windows
        run: pnpm exec electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ReliefForge-Windows
          path: release/ReliefForge-Setup-*.exe

  macos:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attiva pnpm
        run: corepack enable
      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm exec cross-env VITE_ELECTRON=1 vite build --base=./
      - name: Crea app macOS (dmg + zip, non firmata)
        run: pnpm exec electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ReliefForge-macOS
          path: |
            release/ReliefForge-*-mac-*.dmg
            release/ReliefForge-*-mac-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-artifacts
      - name: Pubblica Release con gli installer
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
