name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attiva pnpm
        run: corepack enable
      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm exec cross-env VITE_ELECTRON=1 vite build --base=./
      - name: Crea installer Windows
        run: pnpm exec electron-builder --win --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ReliefForge-Windows
          path: release/ReliefForge-Setup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attiva pnpm
        run: corepack enable
      - name: Installa dipendenze
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm exec cross-env VITE_ELECTRON=1 vite build --base=./
      - name: Crea app macOS (dmg + zip, non firmata)
        run: pnpm exec electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ReliefForge-macOS
          path: |
            release/ReliefForge-*-mac-*.dmg
            release/ReliefForge-*-mac-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-artifacts
      - name: Pubblica Release con gli installer
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/*
          generate_release_notes: true
